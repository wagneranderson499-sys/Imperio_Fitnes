<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Império Fitness</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head><body class="min-h-screen bg-zinc-950 text-white"><header class="border-b border-amber-500/30 p-5 flex justify-between"><a href="/" class="font-bold text-amber-400">IMPÉRIO FITNESS</a><span class="text-zinc-400">Portal do Cliente</span></header><main class="max-w-xl mx-auto p-6"><div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-7 mt-10"><h1 class="text-3xl font-bold mb-6">Entrar na conta</h1><p th:if="${sucesso}" th:text="${sucesso}" class="text-green-400 mb-4"></p><p th:if="${param.error}" class="text-red-400 mb-4">E-mail ou senha inválidos.</p><form method="post" action="/login" class="space-y-4"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><label class="block">E-mail<input type="email" name="username" required class="w-full mt-2 p-3 rounded bg-zinc-800"></label><label class="block">Senha<input type="password" name="password" required class="w-full mt-2 p-3 rounded bg-zinc-800"></label><button class="w-full bg-amber-500 text-black font-bold p-3 rounded">Entrar</button></form><p class="mt-5 text-zinc-400">Ainda não tem conta? <a th:href="@{/cadastro(plano=${plano})}" class="text-amber-400">Cadastre-se</a></p></div></main></body></html>
