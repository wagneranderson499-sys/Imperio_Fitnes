<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Império Fitness</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head><body class="min-h-screen bg-zinc-950 text-white"><header class="border-b border-amber-500/30 p-5 flex justify-between"><a href="/" class="font-bold text-amber-400">IMPÉRIO FITNESS</a><span class="text-zinc-400">Portal do Cliente</span></header><main class="max-w-xl mx-auto p-6"><div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-7 mt-10"><h1 class="text-3xl font-bold mb-2">Criar conta</h1><p class="text-zinc-400 mb-6">Cadastre-se para solicitar sua matrícula.</p><p th:if="${erro}" th:text="${erro}" class="text-red-400 mb-4"></p><form method="post" action="/cadastro" class="space-y-4"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><input type="hidden" name="plano" th:value="${plano}"><label class="block">Nome completo<input required name="nome" class="w-full mt-2 p-3 rounded bg-zinc-800"></label><label class="block">E-mail<input required type="email" name="email" class="w-full mt-2 p-3 rounded bg-zinc-800"></label><label class="block">Senha (mínimo 8 caracteres)<input required minlength="8" type="password" name="senha" class="w-full mt-2 p-3 rounded bg-zinc-800"></label><button class="w-full bg-amber-500 text-black font-bold p-3 rounded">Criar conta</button></form><p class="mt-5 text-zinc-400">Já tem conta? <a th:href="@{/login(plano=${plano})}" class="text-amber-400">Entrar</a></p></div></main></body></html>
