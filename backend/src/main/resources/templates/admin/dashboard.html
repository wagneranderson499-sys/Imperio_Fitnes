<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Império Fitness</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head><body class="bg-zinc-950 text-white min-h-screen"><div class="flex min-h-screen"><aside class="w-64 bg-zinc-900 p-6 border-r border-amber-600/30"><h1 class="text-xl font-bold text-amber-400 mb-10">IMPÉRIO FITNESS</h1><a href="/admin" class="block p-3 bg-zinc-800 rounded">Matrículas</a><a href="/" class="block p-3 mt-3 text-zinc-400">Ver Home</a><form action="/logout" method="post" class="mt-8"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button class="text-zinc-400">Sair</button></form></aside><main class="flex-1 p-8"><h2 class="text-3xl font-bold mb-8">Matrículas recebidas</h2><div class="overflow-x-auto"><table class="w-full text-left"><thead class="text-amber-400"><tr><th class="p-3">Aluno</th><th>Plano</th><th>Status</th><th>Data</th></tr></thead><tbody><tr th:each="m : ${matriculas}" class="border-t border-zinc-800"><td class="p-3" th:text="${m.aluno.nome}">Aluno</td><td th:text="${m.plano}">Plano</td><td th:text="${m.status}">Pendente</td><td th:text="${m.criadaEm}">Data</td></tr></tbody></table><p th:if="${#lists.isEmpty(matriculas)}" class="text-zinc-400 mt-6">Nenhuma matrícula ainda.</p></div></main></div></body></html>
