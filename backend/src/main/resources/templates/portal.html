<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu portal | Império Fitness</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head><body class="min-h-screen bg-zinc-950 text-white"><header class="border-b border-amber-500/30 p-5 flex justify-between"><a href="/" class="font-bold text-amber-400">IMPÉRIO FITNESS</a><span class="text-zinc-400">Portal do Cliente</span></header><main class="max-w-xl mx-auto p-6"><div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-7 mt-10"><h1 class="text-3xl font-bold">Olá, <span th:text="${aluno.nome}">Aluno</span>!</h1><p class="text-zinc-400 mt-2 mb-6">Acompanhe sua matrícula.</p><p th:if="${sucesso}" th:text="${sucesso}" class="text-green-400 mb-4"></p><p th:if="${erro}" th:text="${erro}" class="text-red-400 mb-4"></p><form method="post" action="/portal/matriculas" class="space-y-3"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><label class="block">Plano desejado<input name="plano" maxlength="100" required class="w-full mt-2 p-3 rounded bg-zinc-800" placeholder="Nome do plano"></label><button class="bg-amber-500 text-black font-bold p-3 rounded w-full">Solicitar matrícula</button></form><h2 class="text-xl font-semibold mt-8 mb-3">Minhas matrículas</h2><p th:if="${#lists.isEmpty(matriculas)}" class="text-zinc-400">Nenhuma matrícula registrada.</p><div th:each="m : ${matriculas}" class="border-t border-zinc-700 py-3 flex justify-between"><span th:text="${m.plano}">Plano</span><span class="text-amber-400" th:text="${m.status}">PENDENTE</span></div><form action="/logout" method="post" class="mt-8"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button class="text-zinc-400 underline">Sair</button></form></div></main></body></html>
